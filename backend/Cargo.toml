[package]
name = "appmirror-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
# MCP : identifiants de session SSE, flux SSE, encodage des ressources binaires.
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8.0"
eframe = "0.27"
local-ip-address = "0.6"
webbrowser = "1.0"
# WebRTC/H.264 streaming — optionnel : `openh264` compile libopenh264 en C++ via
# `openh264-sys2` (nécessite une toolchain C++). Derrière la feature `webrtc`
# (activée par défaut) pour que `cargo check --no-default-features` type-check le
# reste du code sans la dépendance native. Voir CLAUDE.md.
webrtc = { version = "0.10", optional = true }
openh264 = { version = "0.4", optional = true }

[features]
default = ["webrtc", "pipewire"]
# Streaming WebRTC/H.264 (dépendance C++ openh264).
webrtc = ["dep:webrtc", "dep:openh264"]
# Capture PipeWire/Wayland sous Linux (lie libpipewire, une lib C).
pipewire = ["dep:pipewire", "dep:ashpd"]


# Capture: Windows Graphics Capture wrapper
[target.'cfg(windows)'.dependencies]
windows-capture = "1.4"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_StationsAndDesktops",
    "Win32_Security",
] }

# Capture/input Linux : X11 (pur Rust, toujours présent) + PipeWire/Wayland
# (optionnel, derrière la feature `pipewire` — lie la lib C libpipewire).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
ashpd = { version = "0.8", features = ["tokio"], optional = true }
pipewire = { version = "0.8", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
